<main id="section__daily" class="section__daily " name="global">
  <section class="section__daily--list">
    <div class="section__daily--list-heading">
      <div class="section__daily--list-heading_action">
        <a routerLink="form">
          <fa-icon id="dailyFormIcon" [icon]="faFileCirclePlus" class="section__daily--list-heading_action-btn btn"
            title="dailyForm">
          </fa-icon>
        </a>
        <p id="dailyCount"></p>
        <div class="section__daily--list-heading_action-group">
          <a routerLink="filter">
            <fa-icon id="dailyFilterIcon" [icon]="faFilter" class="section__daily--list-heading_action-btn btn"
              title="filter">
            </fa-icon>
          </a>
          <fa-icon id="dailyDownloadIcon" [icon]="faDownload" class="section__daily--list-heading_action-btn btn"
            title="xlsx export"></fa-icon>
        </div>
      </div>
      <div class="section__daily--list-heading_headers">
        <div>Username</div>
        <div>Job Count</div>
        <div>Total Hrs</div>
        <div>Work Date</div>
        <div>Submit Date</div>
        <div>Approve Date</div>
      </div>
    </div>
    <ul class="section__daily--list-rows">
      <li class="section__daily--list-rows_job">
        <div>DEMO654</div>
        <div>2</div>
        <div>11</div>
        <div>2022-04-06</div>
        <div>2022-04-07</div>
        <div>2022-04-11</div>
      </li>
    </ul>
  </section>
</main>
