<div class="aspect__group">
  <div class="aspect__group--info">
    <label for="{{ aspect }}-assignee">{{ aspect }} ASSIGNEE</label>
    <select id="{{ aspect }}-assignee" class="aspect__group--info_field">
      <option value=""></option>
      <option value="">A Crew# 1</option>
      <option value="">A Crew# 2</option>
      <option value="">U Crew# 1</option>
      <option value="">U Crew# 2</option>
      <option value="">Splicer# 1</option>
      <option value="">Splicer# 2</option>
      <option value="">Splicer# 3</option>
    </select>
  </div>
  <div class="aspect__group--info">
    <label for="{{ aspect }}-ecd">{{ aspect }} ECD</label>
    <input type="date" id="{{ aspect }}-ecd" class="aspect__group--info_input">
  </div>
  <div class="aspect__group--info">
    <label for="{{ aspect }}-complete">{{ aspect }} Complete</label>
    <input type="date" id="{{ aspect }}-complete" class="aspect__group--info_input">
  </div>
  <fa-icon [icon]="faSquareMinus"></fa-icon>
</div>
